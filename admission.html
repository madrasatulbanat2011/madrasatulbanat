  <!-- Admission Form Section -->
  <section class="form-section">
    <div class="form-card">
      <h2>🎓 অনলাইনে ভর্তির আবেদন (২০২৬)</h2>
      <form id="admissionForm">
        <div class="form-grid">
          
          <!-- Personal Details -->
          <div class="form-group">
            <label>ছাত্রীর পূর্ণ নাম (Full Name)*</label>
            <input type="text" id="studentName" placeholder="ছাত্রীর নাম লিখুন" required>
          </div>

          <div class="form-group">
            <label>পিতার নাম (Father's Name)*</label>
            <input type="text" id="fatherName" placeholder="পিতার নাম লিখুন" required>
          </div>

          <div class="form-group">
            <label>মাতার নাম (Mother's Name)</label>
            <input type="text" id="motherName" placeholder="মাতার নাম লিখুন">
          </div>

          <div class="form-group">
            <label>মোবাইল নম্বর (Mobile No)*</label>
            <input type="tel" id="mobileNumber" placeholder="১০ ডিজিটের মোবাইল নম্বর" pattern="[0-9]{10}" required>
          </div>

          <div class="form-group">
            <label>জন্ম তারিখ (Date of Birth)*</label>
            <input type="date" id="dob" required>
          </div>

          <!-- Course Selection -->
          <div class="form-group">
            <label>কোর্সের নাম (Course Name)*</label>
            <select id="department" required>
              <option value="">কোর্স নির্বাচন করুন</option>
              <option value="General">জেনারেল (General)</option>
              <option value="Hifz">হিফজ (Hifz)</option>
              <option value="Arabic General">এরাবিক জেনারেল (Arabic General)</option>
              <option value="Arabic">আরবিক (Arabic)</option>
            </select>
          </div>

          <!-- Class Selection -->
          <div class="form-group">
            <label>ভর্তির শ্রেণি / জামাত (Class)*</label>
            <select id="className" required>
              <option value="">শ্রেণি বা জামাত নির্বাচন করুন</option>
              <optgroup label="আরবি জামাতসমূহ">
                <option value="Maktab">১. মক্তব</option>
                <option value="Adna Alif">২. আদনা আলিফ</option>
                <option value="Adna Ba">৩. আদনা বা</option>
                <option value="Ula">৪. উলা</option>
                <option value="Saniya">৫. সানিয়া</option>
                <option value="Salisha">৬. সালিষা</option>
                <option value="Rabiya">৭. রাবিয়া</option>
                <option value="Khamisa">৮. খামিসা</option>
                <option value="Sadisha">৯. সাদিশা</option>
                <option value="Daura">১০. দাওরা</option>
              </optgroup>
              <optgroup label="সাধারণ শ্রেণি (General Class)">
                <option value="Class III">Class III</option>
                <option value="Class IV">Class IV</option>
                <option value="Class V">Class V</option>
                <option value="Class VI">Class VI</option>
                <option value="Class VII">Class VII</option>
                <option value="Class VIII">Class VIII</option>
                <option value="Class IX">Class IX</option>
                <option value="Class X">Class X</option>
                <option value="Class XI">Class XI</option>
                <option value="Class XII">Class XII</option>
              </optgroup>
            </select>
          </div>

          <!-- Previous School Details -->
          <div class="form-group">
            <label>পূর্বের স্কুল/মাদ্রাসার নাম (Previous School/Madrasa)</label>
            <input type="text" id="prevSchool" placeholder="আগে যে প্রতিষ্ঠানে পড়তো">
          </div>

          <div class="form-group">
            <label>পূর্বের শ্রেণি (Previous Class)</label>
            <input type="text" id="prevClass" placeholder="আগে যে শ্রেণিতে পড়তো">
          </div>

          <!-- Residential Option -->
          <div class="form-group">
            <label>আবাসিক ব্যবস্থা (Residence)*</label>
            <select id="residence" required>
              <option value="Hostel">আবাসিক (Hostel)</option>
              <option value="Day Scholar">অনাবাসিক (Day Scholar)</option>
            </select>
          </div>

          <!-- Address -->
          <div class="form-group full-width">
            <label>সম্পূর্ণ ঠিকানা (Address)*</label>
            <textarea id="address" rows="3" placeholder="গ্রাম/পাড়া, পোস্ট অফিস, থানা, জেলা" required></textarea>
          </div>

          <!-- Document Uploads -->
          <div class="form-group full-width">
            <h3 style="margin-top: 15px; margin-bottom: 10px; color: #1b5e20; font-size: 1.1rem; border-bottom: 2px solid #e0e0e0; padding-bottom: 5px;">📎 প্রয়োজনীয় ডকুমেন্টস আপলোড (Document Upload)</h3>
          </div>

          <div class="form-group">
            <label>ছাত্রীর ছবি (Student Photo)*</label>
            <input type="file" id="studentPhoto" accept="image/*" required>
          </div>

          <div class="form-group">
            <label>টিসি সার্টিফিকেট (TC Certificate)</label>
            <input type="file" id="tcCertificate" accept="image/*,.pdf">
          </div>

          <div class="form-group">
            <label>জন্ম সার্টিফিকেট (Birth Certificate)*</label>
            <input type="file" id="birthCertificate" accept="image/*,.pdf" required>
          </div>

          <div class="form-group">
            <label>স্কুল সার্টিফিকেট / মার্কশীট (School Certificate)</label>
            <input type="file" id="schoolCertificate" accept="image/*,.pdf">
          </div>

          <div class="form-group full-width">
            <label>অন্যান্য ডকুমেন্টস (Other Documents)</label>
            <input type="file" id="otherDocs" accept="image/*,.pdf">
          </div>

        </div>

        <button type="submit" class="btn-submit">আবেদন জমা দিন</button>
      </form>
    </div>
  </section>

  <script type="module" src="admission.js"></script>
</body>
</html>
