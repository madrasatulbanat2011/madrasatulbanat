<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Admission - Barbakpur Madrasatul Banat</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; }
    .form-container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #1b5e20; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .btn-submit { background: #1b5e20; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .receipt { display: none; background: #fff; padding: 20px; border: 2px dashed #1b5e20; border-radius: 8px; margin-top: 20px; }
    .btn-print { background: #0288d1; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

<div class="form-container">
  <h2>🎓 অনলাইন ভর্তি ফরম ২০২৬</h2>
  
  <form id="admissionForm">
    <div class="form-group">
      <label>ছাত্রীর নাম *</label>
      <input type="text" id="stdName" required placeholder="পুরা নাম লিখুন">
    </div>
    <div class="form-group">
      <label>অভিভাবকের নাম *</label>
      <input type="text" id="parentName" required placeholder="পিতা/অভিভাবকের নাম">
    </div>
    <div class="form-group">
      <label>মোবাইল নম্বর *</label>
      <input type="tel" id="mobile" required placeholder="১০ ডিজিটের মোবাইল নম্বর">
    </div>
    <div class="form-group">
      <label>ভর্তির শ্রেণি *</label>
      <select id="classSelect" required>
        <option value="">-- শ্রেণি নির্বাচন করুন --</option>
        <option value="Class 1">প্রথম শ্রেণি</option>
        <option value="Class 2">দ্বিতীয় শ্রেণি</option>
        <option value="Class 3">তৃতীয় শ্রেণি</option>
        <option value="Arabic High">আরবি বিভাগ</option>
      </select>
    </div>
    <button type="submit" class="btn-submit">আবেদন সেভ করুন ও পেমেন্ট করুন</button>
  </form>

  <!-- আবেদনের পর ছাত্রীদের জন্য প্রিন্ট রসিদ -->
  <div id="receiptBox" class="receipt">
    <h3 style="text-align:center; color:#1b5e20;">Barbakpur Madrasatul Banat</h3>
    <p style="text-align:center; font-size:12px;">আবেদন রসিদ (Application Slip)</p>
    <hr>
    <p><strong>আবেদন আইডি:</strong> <span id="recId"></span></p>
    <p><strong>ছাত্রীর নাম:</strong> <span id="recName"></span></p>
    <p><strong>অভিভাবকের নাম:</strong> <span id="recParent"></span></p>
    <p><strong>শ্রেণি:</strong> <span id="recClass"></span></p>
    <p><strong>পেমেন্ট স্ট্যাটাস:</strong> <span style="color:green; font-weight:bold;">সফল (Paid)</span></p>
    <hr>
    <button onclick="window.print()" class="btn-print">📄 স্লিপ প্রিন্ট করুন</button>
  </div>
</div>

<script type="module">
  import { db } from "./firebase.js";
  import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  document.getElementById("admissionForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const name = document.getElementById("stdName").value;
    const parent = document.getElementById("parentName").value;
    const mobile = document.getElementById("mobile").value;
    const className = document.getElementById("classSelect").value;
    const appNum = "BMB" + Math.floor(100000 + Math.random() * 900000);

    try {
      // ডাটাবেসে তথ্য নিরাপদভাবে পাঠানো
      await addDoc(collection(db, "admissions"), {
        appId: appNum,
        studentName: name,
        parentName: parent,
        phone: mobile,
        class: className,
        paymentStatus: "Completed",
        date: new Date().toLocaleDateString("bn-IN")
      });

      // ফর্ম লুকিয়ে শুধু ছাত্রীর নিজস্ব প্রিন্ট রসিদ দেখানো
      document.getElementById("admissionForm").style.display = "none";
      document.getElementById("receiptBox").style.display = "block";
      document.getElementById("recId").innerText = appNum;
      document.getElementById("recName").innerText = name;
      document.getElementById("recParent").innerText = parent;
      document.getElementById("recClass").innerText = className;

    } catch (err) {
      alert("❌ ত্রুটি হয়েছে! আবার চেষ্টা করুন।");
      console.error(err);
    }
  });
</script>

</body>
</html>
