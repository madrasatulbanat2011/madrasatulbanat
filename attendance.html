<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance | Barbakpur Madrasatul Banat</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background: #f4f8f5;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        h1 {
            text-align: center;
            color: #006b3c;
            margin-top: 0;
            font-size: 26px;
        }

        /* Controls Section */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        input[type="date"], select {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .btn-bio {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-bio:hover { background: #0369a1; }

        /* Table Design */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #006b3c;
            color: white;
            font-weight: 600;
        }

        tr:hover { background-color: #f8fafc; }

        /* Custom Radio Buttons */
        .status-radio {
            transform: scale(1.3);
            cursor: pointer;
            accent-color: #006b3c;
        }

        .status-radio.absent {
            accent-color: #dc2626;
        }

        /* Bottom Buttons */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn-save {
            background: #006b3c;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .btn-save:hover { background: #004f2d; }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-secondary:hover { background: #cbd5e1; }
    </style>
</head>

<body>

    <div class="container">
        <h1>📋 Student Attendance System</h1>

        <!-- Controls: Date, Class & Biometric Option -->
        <div class="controls">
            <div class="control-group">
                <label for="attendanceDate">তারিখ:</label>
                <input type="date" id="attendanceDate">
            </div>

            <div class="control-group">
                <label for="classSelect">শ্রেণী নির্বাচন:</label>
                <select id="classSelect">
                    <option value="">-- শ্রেণী নির্বাচন করুন --</option>
                    <option value="Class 1">Class 1</option>
                    <option value="Class 2">Class 2</option>
                    <option value="Class 3">Class 3</option>
                    <option value="Class 4">Class 4</option>
                    <option value="Class 5">Class 5</option>
                </select>
            </div>

            <!-- Future Biometric Scanner Trigger -->
            <button type="button" class="btn-bio" id="biometricBtn">
                👆 Biometric Scan
            </button>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 10px;">
            <button type="button" class="btn-secondary" id="markAllPresent">সবাইকে Present করুন</button>
        </div>

        <!-- Attendance Table -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ক্রমিক</th>
                        <th>ছাত্রীর নাম</th>
                        <th>শ্রেণী</th>
                        <th>উপস্থিত (Present)</th>
                        <th>অনুপস্থিত (Absent)</th>
                    </tr>
                </thead>
                <tbody id="attendanceTable">
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 20px;">শ্রেণী নির্বাচন করুন...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="action-bar">
            <span id="studentCount" style="font-size: 14px; font-weight: 500; color: #64748b;">মোট ছাত্রী: ০</span>
            <button id="saveAttendance" class="btn-save">Save Attendance</button>
        </div>
    </div>

    <script type="module" src="attendance.js"></script>

</body>
</html>
