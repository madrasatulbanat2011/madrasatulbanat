<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Admin - Barbakpur Madrasatul Banat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Poppins', sans-serif; }
        .table-wrapper { width: 100%; overflow-x: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
        th { background: #0B6E4F; color: white; font-weight: 600; }
        
        /* Modal Overlay */
        #loginOverlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }

        .login-box {
            background: white; padding: 35px 30px;
            border-radius: 12px; width: 90%; max-width: 380px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .login-box h3 { color: #0B6E4F; margin-bottom: 10px; font-size: 22px; }
        .login-box input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1;
            border-radius: 8px; font-size: 15px; margin-bottom: 15px; text-align: center;
        }
    </style>
</head>
<body>

    <!-- Password Protection Overlay -->
    <div id="loginOverlay">
        <div class="login-box">
            <h3>🔒 Notice Admin Login</h3>
            <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">নোটিশ আপলোড করতে পাসওয়ার্ড লিখুন</p>
            <form id="loginForm">
                <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন" required autofocus>
                <button type="submit" class="btn-submit" style="width: 100%; padding: 12px;">লগইন করুন</button>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <div id="adminContent" class="container" style="padding: 40px 15px; display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: #0B6E4F;">📢 নতুন নোটিশ প্রকাশ করুন</h2>
            <button id="logoutBtn" style="padding: 8px 18px; background: #dc2626; color: white; border: none; border-radius: 8px; cursor: pointer;">লগআউট</button>
        </div>

        <!-- Add Notice Form -->
        <div class="form-card" style="max-width: 700px; margin: 0 auto;">
            <form id="noticeForm">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="noticeTitle">নোটিশের শিরোনাম (Notice Title)*</label>
                    <input type="text" id="noticeTitle" placeholder="উদাহরণ: ২০২৬ শিক্ষা বর্ষের বার্ষিক পরীক্ষার সময়সূচী" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="noticeDescription">নোটিশের বিস্তারিত বিবরণ (Description)</label>
                    <textarea id="noticeDescription" rows="4" placeholder="নোটিশ সম্পর্কিত বিশদ বিবরণ লিখুন..."></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="noticeLink">PDF / গুগল ড্রাইভ লিঙ্ক (Optional Download Link)</label>
                    <input type="url" id="noticeLink" placeholder="https://drive.google.com/...">
                </div>

                <button type="submit" id="submitBtn" class="btn-submit" style="width: 100%;">প্রকাশ করুন</button>
            </form>
        </div>

        <!-- Published Notice List -->
        <div class="table-wrapper">
            <h3 style="color: #0B6E4F; margin-bottom: 15px;">📋 প্রকাশিত নোটিশের তালিকা</h3>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ</th>
                        <th>শিরোনাম</th>
                        <th>লিংক</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="noticeList">
                    <tr><td colspan="4" style="text-align: center;">ডাটা লোড হচ্ছে...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="notice-admin.js"></script>
</body>
</html>
