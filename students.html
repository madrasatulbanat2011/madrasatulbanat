<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students List | Barbakpur Madrasatul Banat</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background: #f4f8f5;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        h1 {
            text-align: center;
            color: #006b3c;
            margin-top: 0;
            font-size: 26px;
        }

        .search-container {
            position: relative;
            margin: 20px 0;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #006b3c;
            box-shadow: 0 0 0 3px rgba(0, 107, 60, 0.15);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 14px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #006b3c;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .btn-view {
            padding: 8px 16px;
            background: #006b3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s ease;
        }

        .btn-view:hover {
            background: #004f2d;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎓 Student Database</h1>

        <div class="search-container">
            <input type="text" id="searchBox" placeholder="🔍 নাম, শ্রেণী, মোবাইল নম্বর বা গ্রাম দিয়ে খোঁজ করুন...">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Mobile</th>
                        <th>Village</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 20px;">ডাটা লোড হচ্ছে...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="students.js"></script>

</body>
</html>
