<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - All Student Admissions</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #1b5e20; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #1b5e20; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .badge { background: #2e7d32; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🔒 অ্যাডমিন প্যানেল: সকল ভর্তি আবেদনের তালিকা</h2>
  
  <table>
    <thead>
      <tr>
        <th>আবেদন আইডি</th>
        <th>ছাত্রীর নাম</th>
        <th>অভিভাবকের নাম</th>
        <th>ফোন নম্বর</th>
        <th>শ্রেণি</th>
        <th>পেমেন্ট</th>
      </tr>
    </thead>
    <tbody id="adminTableBody">
      <!-- সব ডাটা এখানে সেফলি দেখাবে -->
    </tbody>
  </table>
</div>

<script type="module">
  import { db } from "./firebase.js";
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // সিকিউরিটি চেক: অ্যাডমিন লগইন ছাড়া পেজ খুলবে না
  if (localStorage.getItem("isAdminLoggedIn") !== "true") {
    alert("❌ আপনার এই পেজে ঢোকার অনুমতি নেই! আগে অ্যাডমিন লগইন করুন।");
    window.location.href = "login.html";
  } else {
    loadAllAdmissions();
  }

  async function loadAllAdmissions() {
    const querySnapshot = await getDocs(collection(db, "admissions"));
    const tbody = document.getElementById("adminTableBody");
    tbody.innerHTML = "";

    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const row = `<tr>
        <td><b>${data.appId || 'N/A'}</b></td>
        <td>${data.studentName}</td>
        <td>${data.parentName}</td>
        <td>${data.phone}</td>
        <td>${data.class}</td>
        <td><span class="badge">${data.paymentStatus}</span></td>
      </tr>`;
      tbody.innerHTML += row;
    });
  }
</script>

</body>
</html>
