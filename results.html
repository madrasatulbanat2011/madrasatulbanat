<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Result - Barbakpur Madrasatul Banat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">🕌 BMB</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="admission.html">Admission</a></li>
                    <li><a href="results.html" class="active">Search Result</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="form-section">
        <div class="container">
            <!-- Search Box -->
            <div class="form-card" style="max-width: 550px; text-align: center;">
                <div class="form-header">
                    <h2>🔍 পরীক্ষা রেজাল্ট খুঁজুন</h2>
                    <p>ছাত্রীর আইডি নম্বর দিয়ে নিচে সার্চ করুন</p>
                </div>
                
                <form id="searchForm" style="display: flex; gap: 10px; margin-top: 20px;">
                    <input type="text" id="searchId" placeholder="উদাহরণ: BMB-2026-101" required style="flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
                    <button type="submit" id="searchBtn" class="btn-submit" style="width: auto; padding: 12px 25px;">Search</button>
                </form>
            </div>

            <!-- Result Display Card -->
            <div id="resultDisplay" class="form-card" style="max-width: 650px; margin-top: 30px; display: none;">
                <div class="form-header">
                    <h2 id="resStudentName" style="color: #0B6E4F;"></h2>
                    <p id="resExamName"></p>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; font-size: 14px;">
                    <div><strong>আইডি:</strong> <span id="resId"></span></div>
                    <div><strong>শ্রেণী:</strong> <span id="resClass"></span></div>
                    <div><strong>পিতার নাম:</strong> <span id="resFather"></span></div>
                    <div><strong>মাতার নাম:</strong> <span id="resMother"></span></div>
                </div>

                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                    <thead>
                        <tr style="background-color: #0B6E4F; color: white; text-align: left;">
                            <th style="padding: 10px; border-radius: 6px 0 0 6px;">বিষয়</th>
                            <th style="padding: 10px; border-radius: 0 6px 6px 0; text-align: right;">প্রাপ্ত নম্বর</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 10px;">বাংলা</td><td id="resBangla" style="text-align: right; padding: 10px;"></td></tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 10px;">ইংরেজি</td><td id="resEnglish" style="text-align: right; padding: 10px;"></td></tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 10px;">গণিত</td><td id="resMath" style="text-align: right; padding: 10px;"></td></tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 10px;">বিজ্ঞান</td><td id="resScience" style="text-align: right; padding: 10px;"></td></tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 10px;">ইতিহাস</td><td id="resHistory" style="text-align: right; padding: 10px;"></td></tr>
                        <tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 10px;">ভূগোল</td><td id="resGeography" style="text-align: right; padding: 10px;"></td></tr>
                    </tbody>
                </table>

                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; background: #e6f4ea; padding: 15px; border-radius: 8px;">
                    <div>মোট নম্বর: <span id="resTotal"></span></div>
                    <div>গ্রেড: <span id="resGrade"></span></div>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="results.js"></script>
</body>
</html>
